name: MediFind production smoke test

on:
  push:
    branches: [main]
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && (github.event.deployment.environment == 'Production' || github.event.deployment.environment == 'production'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify production health and public endpoints
        env:
          EXPECTED_SHA: ${{ github.event.deployment.sha || github.sha }}
          MEDIFIND_BASE_URL: https://medifind-xpro4.vercel.app
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          base = os.environ['MEDIFIND_BASE_URL'].rstrip('/')
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(base+path, headers={'User-Agent':'MediFind-CI-smoke/1.0'}), timeout=20) as response:
                  data = response.read(2_000_000)
                  return response.status, json.loads(data.decode('utf-8'))

          # Verify the deployed commit, database, and storage together before passing.
          healthy = False
          for attempt in range(24):
              try:
                  status, body = get('/api/health')
                  if status == 200 and body.get('status') == 'healthy' and body.get('database') == 'available' and body.get('version') == os.environ['EXPECTED_SHA']:
                      storage_status, storage = get('/api/health/storage')
                      if storage_status == 200 and storage.get('storage') == 'available':
                          healthy = True
                          break
              except (urllib.error.URLError, ValueError, TimeoutError) as exc:
                  print('Waiting for production:', str(exc)[:120])
              time.sleep(10)
          assert healthy, 'Production backend health did not validate DB connectivity'

          status, body = get('/api/health/storage')
          assert status == 200 and body.get('status') == 'healthy' and body.get('storage') == 'available', 'Private Supabase storage unavailable'
          print('Private Supabase Storage buckets: OK')

          status, body = get('/api/medicines/search?q=dolo')
          assert status == 200, f'Medicine search HTTP {status}'
          assert isinstance(body, dict), 'Medicine search did not return a JSON object'
          print('Medicine search: OK')

          status, body = get('/api/pharmacies')
          assert status == 200, f'Pharmacy listing HTTP {status}'
          assert isinstance(body.get('pharmacies'), list), 'Expected pharmacies array'
          print('Pharmacy directory: OK, entries:', len(body['pharmacies']))

          status, body = get('/api/auth/current-user')
          assert status == 200 and isinstance(body, dict), 'Anonymous current-user endpoint malformed'
          print('Anonymous user endpoint: OK')
          PY
