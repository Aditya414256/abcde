name: MediFind backend tests

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065c # v5.6.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run backend tests
        env:
          FLASK_ENV: testing
        run: python -m pytest tests/test_medifind.py tests/test_security_regressions.py tests/test_audit_regressions.py tests/test_migrations.py tests/test_supabase_storage.py -q -k 'not test_supabase_storage_service_configured and not test_supabase_storage_direct_roundtrip and not test_supabase_pharmacy_docs_roundtrip and not test_prescription_service_saves_to_supabase'
      # Remote storage integration tests require separate, private test credentials.
      # PostgreSQL concurrency tests require a disposable localhost PostgreSQL database.

  postgres-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: medifind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d medifind_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065c # v5.6.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: PostgreSQL race/overselling tests (disposable local DB only)
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/medifind_test
          FLASK_ENV: testing
        run: python tests/test_pg_concurrency.py
